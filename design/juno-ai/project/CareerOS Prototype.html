<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CareerOS — Juno</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.453.0/font/lucide.css" />
<style>
  :root {
    --background: 45 22% 97%;
    --foreground: 25 15% 18%;
    --card: 0 0% 100%;
    --card-foreground: 25 15% 18%;
    --primary: 152 26% 40%;
    --primary-foreground: 0 0% 100%;
    --secondary: 40 18% 93%;
    --secondary-foreground: 25 12% 28%;
    --muted: 40 14% 94%;
    --muted-foreground: 25 10% 52%;
    --accent: 150 14% 92%;
    --accent-foreground: 152 26% 28%;
    --destructive: 5 68% 50%;
    --border: 40 16% 88%;
    --input: 40 16% 88%;
    --ring: 152 26% 40%;
    --radius: 0.75rem;
    --surface-0: 45 22% 97%;
    --surface-1: 40 18% 95%;
    --surface-2: 40 14% 92%;
    --surface-3: 40 12% 88%;

    /* lane tokens */
    --lane-emerald: 152 26% 40%;
    --lane-emerald-soft: 152 26% 94%;
    --lane-blue: 217 50% 50%;
    --lane-violet: 268 45% 55%;

    /* status colors (muted, sage-aligned) */
    --status-rising: 152 26% 40%;
    --status-stable: 217 35% 50%;
    --status-declining: 32 60% 48%;
    --status-risk: 5 60% 50%;
  }
  .dark {
    --background: 30 8% 9%;
    --foreground: 40 18% 90%;
    --card: 30 7% 13%;
    --card-foreground: 40 18% 90%;
    --primary: 152 26% 55%;
    --primary-foreground: 0 0% 100%;
    --secondary: 30 6% 20%;
    --secondary-foreground: 40 14% 82%;
    --muted: 30 6% 18%;
    --muted-foreground: 35 8% 62%;
    --accent: 152 20% 22%;
    --accent-foreground: 152 26% 78%;
    --destructive: 5 60% 50%;
    --border: 30 6% 22%;
    --input: 30 6% 22%;
    --ring: 152 26% 55%;
    --surface-0: 30 8% 9%;
    --surface-1: 30 7% 13%;
    --surface-2: 30 6% 17%;
    --surface-3: 30 6% 22%;
    --lane-emerald-soft: 152 26% 18%;
    --status-rising: 152 30% 58%;
    --status-stable: 217 40% 65%;
    --status-declining: 32 60% 60%;
    --status-risk: 5 60% 62%;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-feature-settings: 'cv02','cv03','cv04','cv11';
    letter-spacing: -0.008em;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  h1, h2, h3, h4, h5, h6 {
    letter-spacing: -0.018em;
    text-wrap: balance;
    font-weight: 600;
    margin: 0;
  }
  p { margin: 0; text-wrap: pretty; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: hsl(var(--primary) / 0.2); }

  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .serif { font-family: 'Fraunces', Georgia, serif; }

  /* ---- chrome ---- */
  .app-shell {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }
  .sidebar {
    background: hsl(var(--surface-1));
    border-right: 1px solid hsl(var(--border));
    padding: 22px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 8px 0;
  }
  .brand-mark {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: hsl(var(--primary));
    display: grid; place-items: center;
    color: white;
    font-weight: 600;
    font-size: 14px;
    box-shadow: 0 2px 8px hsl(var(--primary) / 0.25);
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
  }
  .brand-name { font-weight: 600; font-size: 15px; letter-spacing: -0.02em; }
  .brand-lane {
    margin-left: auto;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: hsl(var(--primary));
    background: hsl(var(--accent));
    padding: 3px 7px;
    border-radius: 999px;
  }

  .lane-switcher {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: 10px;
    padding: 4px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 2px;
  }
  .lane-btn {
    border: none; background: transparent;
    padding: 6px 4px;
    border-radius: 7px;
    font-size: 10.5px;
    font-weight: 600;
    color: hsl(var(--muted-foreground));
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .lane-btn.active {
    background: hsl(var(--accent));
    color: hsl(var(--accent-foreground));
  }
  .lane-btn .dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: hsl(var(--muted-foreground) / 0.5);
  }
  .lane-btn.active .dot { background: hsl(var(--primary)); }
  .lane-btn[data-lane="founder"] .dot { background: hsl(var(--lane-blue)); }
  .lane-btn[data-lane="creator"] .dot { background: hsl(var(--lane-violet)); }
  .lane-btn[data-lane="career"] .dot { background: hsl(var(--lane-emerald)); }

  .nav-section {
    display: flex; flex-direction: column; gap: 1px;
  }
  .nav-heading {
    padding: 8px 10px 6px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: hsl(var(--muted-foreground));
  }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    color: hsl(var(--foreground) / 0.78);
    border: none; background: transparent;
    width: 100%;
    text-align: left;
    transition: background-color 0.16s, color 0.16s;
  }
  .nav-item:hover { background: hsl(var(--surface-2)); color: hsl(var(--foreground)); }
  .nav-item.active {
    background: hsl(var(--accent));
    color: hsl(var(--accent-foreground));
    font-weight: 500;
  }
  .nav-item .nav-icon {
    width: 16px; height: 16px;
    color: currentColor;
    opacity: 0.85;
    flex-shrink: 0;
  }
  .nav-item .nav-badge {
    margin-left: auto;
    font-size: 10.5px;
    background: hsl(var(--primary) / 0.12);
    color: hsl(var(--primary));
    padding: 1px 6px;
    border-radius: 999px;
    font-weight: 500;
  }

  .sidebar-foot {
    margin-top: auto;
    border-top: 1px solid hsl(var(--border));
    padding-top: 14px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .user-card {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 8px;
    border-radius: 8px;
  }
  .user-card:hover { background: hsl(var(--surface-2)); }
  .avatar {
    width: 28px; height: 28px;
    border-radius: 999px;
    background: linear-gradient(135deg, hsl(152 26% 50%), hsl(168 30% 45%));
    color: white;
    font-weight: 600;
    font-size: 11px;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .user-info { display: flex; flex-direction: column; min-width: 0; }
  .user-name { font-size: 12.5px; font-weight: 500; line-height: 1.2; }
  .user-mail { font-size: 10.5px; color: hsl(var(--muted-foreground)); line-height: 1.2; }

  /* ---- main ---- */
  .main {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    height: 56px;
    border-bottom: 1px solid hsl(var(--border));
    background: hsl(var(--background) / 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex; align-items: center;
    padding: 0 28px;
    gap: 18px;
  }
  .crumbs {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    color: hsl(var(--muted-foreground));
  }
  .crumbs .here { color: hsl(var(--foreground)); font-weight: 500; }
  .crumbs .sep { opacity: 0.4; }
  .top-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    width: 32px; height: 32px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    display: grid; place-items: center;
    color: hsl(var(--muted-foreground));
    transition: background-color 0.16s, color 0.16s, border-color 0.16s;
  }
  .icon-btn:hover { background: hsl(var(--surface-2)); color: hsl(var(--foreground)); }
  .icon-btn.has-badge { position: relative; }
  .icon-btn.has-badge::after {
    content: ''; position: absolute;
    top: 7px; right: 8px;
    width: 6px; height: 6px;
    background: hsl(var(--primary));
    border-radius: 999px;
    border: 1.5px solid hsl(var(--background));
  }

  .page {
    padding: 32px 40px 80px;
    max-width: 1280px;
    width: 100%;
  }
  .page.wide { max-width: 100%; }

  /* ---- common ui ---- */
  .card {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: var(--radius);
    transition: border-color 0.18s, box-shadow 0.18s;
  }
  .card:hover { border-color: hsl(var(--border)); }
  .card.padded { padding: 22px; }
  .card.muted { background: hsl(var(--surface-1)); }
  .card-section {
    padding: 18px 22px;
    border-bottom: 1px solid hsl(var(--border));
  }
  .card-section:last-child { border-bottom: none; }

  .eyebrow {
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: hsl(var(--muted-foreground));
  }
  .h-display {
    font-size: 30px; font-weight: 600; letter-spacing: -0.024em; line-height: 1.15;
  }
  .h-page {
    font-size: 24px; font-weight: 600; letter-spacing: -0.022em; line-height: 1.2;
  }
  .h-section {
    font-size: 15px; font-weight: 600; letter-spacing: -0.012em;
  }
  .h-card {
    font-size: 13px; font-weight: 600; letter-spacing: -0.008em;
  }
  .body { font-size: 13.5px; line-height: 1.55; color: hsl(var(--foreground) / 0.84); }
  .small { font-size: 12.5px; color: hsl(var(--muted-foreground)); }
  .micro { font-size: 11px; color: hsl(var(--muted-foreground)); letter-spacing: 0.01em; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 500;
    background: hsl(var(--surface-2));
    color: hsl(var(--foreground));
    border: 1px solid hsl(var(--border));
  }
  .pill.solid {
    background: hsl(var(--primary) / 0.1);
    color: hsl(var(--primary));
    border-color: hsl(var(--primary) / 0.2);
  }
  .pill.rising { background: hsl(var(--status-rising) / 0.12); color: hsl(var(--status-rising)); border-color: hsl(var(--status-rising) / 0.22); }
  .pill.stable { background: hsl(var(--status-stable) / 0.12); color: hsl(var(--status-stable)); border-color: hsl(var(--status-stable) / 0.22); }
  .pill.declining { background: hsl(var(--status-declining) / 0.12); color: hsl(var(--status-declining)); border-color: hsl(var(--status-declining) / 0.22); }
  .pill.at-risk { background: hsl(var(--status-risk) / 0.12); color: hsl(var(--status-risk)); border-color: hsl(var(--status-risk) / 0.22); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid hsl(var(--border));
    background: hsl(var(--card));
    color: hsl(var(--foreground));
    font-size: 13px;
    font-weight: 500;
    transition: background-color 0.16s, border-color 0.16s, color 0.16s;
  }
  .btn:hover { background: hsl(var(--surface-2)); }
  .btn.primary {
    background: hsl(var(--primary));
    border-color: hsl(var(--primary));
    color: hsl(var(--primary-foreground));
  }
  .btn.primary:hover { background: hsl(var(--primary) / 0.92); }
  .btn.ghost { background: transparent; border-color: transparent; color: hsl(var(--muted-foreground)); }
  .btn.ghost:hover { background: hsl(var(--surface-2)); color: hsl(var(--foreground)); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }
  .btn.lg { padding: 10px 18px; font-size: 14px; }
  .btn i { width: 15px; height: 15px; }

  /* row link (Care)*/
  .row-link {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 18px;
    border-radius: 10px;
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    transition: background-color 0.18s, transform 0.18s;
    text-align: left;
    color: inherit;
  }
  .row-link:hover {
    background: hsl(var(--surface-1));
    transform: translateY(-1px);
  }
  .row-link .icon-tile {
    width: 36px; height: 36px;
    border-radius: 9px;
    background: hsl(var(--accent));
    color: hsl(var(--primary));
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .row-link .icon-tile i { width: 17px; height: 17px; }
  .row-link .copy { flex: 1; min-width: 0; }
  .row-link .title { font-size: 13.5px; font-weight: 500; }
  .row-link .sub { font-size: 12px; color: hsl(var(--muted-foreground)); margin-top: 2px; }
  .row-link .chev { color: hsl(var(--muted-foreground)); }

  /* divider */
  hr.div { border: none; border-top: 1px solid hsl(var(--border)); margin: 0; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background-color: hsl(var(--border)); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background-color: hsl(var(--muted-foreground) / 0.5); }

  /* fade-in for page transitions — animates transform only so a
     tab-throttled page never gets stuck at opacity:0 */
  @keyframes pageEnter {
    from { transform: translateY(6px); }
    to   { transform: translateY(0); }
  }
  .page-enter { animation: pageEnter 0.42s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* tiny sparkline support */
  .spark { display: inline-block; vertical-align: middle; }

  /* sage halo for hero areas */
  .sage-halo {
    background:
      radial-gradient(70% 80% at 90% 10%, hsl(var(--primary) / 0.08), transparent 60%),
      radial-gradient(60% 70% at 0% 100%, hsl(var(--primary) / 0.05), transparent 60%);
  }

  /* ============== VOICE MODE ============== */

  /* persistent dock — floating bottom-center pill */
  .voice-dock {
    position: fixed;
    bottom: 22px;
    left: calc(50% + 120px);
    transform: translateX(-50%);
    z-index: 60;
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: 999px;
    padding: 6px 8px 6px 6px;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 14px 32px hsl(25 15% 18% / 0.10), 0 2px 8px hsl(25 15% 18% / 0.06);
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s, box-shadow 0.2s;
  }
  .voice-dock:hover { box-shadow: 0 20px 40px hsl(25 15% 18% / 0.14), 0 2px 8px hsl(25 15% 18% / 0.06); }
  .voice-dock .mic {
    width: 36px; height: 36px; border-radius: 999px;
    background: hsl(var(--primary));
    color: hsl(var(--primary-foreground));
    display: grid; place-items: center;
    border: none;
    box-shadow: 0 0 0 0 hsl(var(--primary) / 0.5);
    transition: box-shadow 0.3s, transform 0.18s;
  }
  .voice-dock .mic:hover { transform: scale(1.04); }
  .voice-dock .mic:active { transform: scale(0.96); }
  .voice-dock .mic.listening {
    animation: voicePulse 1.6s ease-in-out infinite;
  }
  .voice-dock .hint {
    padding: 0 14px 0 4px;
    font-size: 12.5px;
    color: hsl(var(--muted-foreground));
    display: flex; flex-direction: column; gap: 1px;
    min-width: 130px;
  }
  .voice-dock .hint .label { color: hsl(var(--foreground)); font-weight: 500; font-size: 12.5px; }
  .voice-dock .hint .sub { font-size: 10.5px; }
  .voice-dock .scene-btn {
    border: 1px solid hsl(var(--border));
    background: hsl(var(--surface-1));
    color: hsl(var(--muted-foreground));
    padding: 6px 10px; border-radius: 999px;
    font-size: 11.5px;
    transition: background-color 0.16s, color 0.16s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .voice-dock .scene-btn:hover { background: hsl(var(--accent)); color: hsl(var(--accent-foreground)); }

  @keyframes voicePulse {
    0%   { box-shadow: 0 0 0 0 hsl(var(--primary) / 0.55); }
    70%  { box-shadow: 0 0 0 16px hsl(var(--primary) / 0); }
    100% { box-shadow: 0 0 0 0 hsl(var(--primary) / 0); }
  }

  /* body shifts deeper sage when voice mode active */
  body.voice-active {
    background:
      radial-gradient(80% 60% at 50% 100%, hsl(var(--primary) / 0.10), transparent 70%),
      radial-gradient(60% 40% at 0% 0%,   hsl(var(--primary) / 0.05), transparent 60%),
      hsl(var(--background));
    transition: background 0.5s ease;
  }
  body.voice-active .topbar {
    background: hsl(var(--background) / 0.7);
  }
  .voice-vignette {
    position: fixed;
    inset: 0 0 0 240px;
    pointer-events: none;
    z-index: 25;
    background: radial-gradient(75% 60% at 50% 100%, transparent 0%, hsl(25 15% 18% / 0.16) 80%);
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  body.voice-active .voice-vignette { opacity: 1; }
  body.dark .voice-vignette {
    background: radial-gradient(75% 60% at 50% 100%, transparent 0%, hsl(0 0% 0% / 0.45) 80%);
  }

  /* highlight ring on the element the agent is referencing */
  .voice-target {
    position: relative;
    transition: box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s;
  }
  .voice-target.active {
    box-shadow:
      0 0 0 2px hsl(var(--primary) / 0.55),
      0 0 0 8px hsl(var(--primary) / 0.16),
      0 22px 50px hsl(var(--primary) / 0.20);
    border-radius: 12px;
    z-index: 40;
    transform: translateY(-1px);
  }

  /* voice conversation panel */
  .voice-panel {
    position: fixed;
    bottom: 84px;
    left: calc(240px + 24px);
    right: 24px;
    max-width: 860px;
    margin: 0 auto;
    z-index: 55;
    background: hsl(var(--card) / 0.94);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid hsl(var(--border));
    border-radius: 18px;
    padding: 16px 18px;
    box-shadow: 0 22px 60px hsl(25 15% 18% / 0.18), 0 4px 16px hsl(25 15% 18% / 0.06);
    animation: voicePanelEnter 0.36s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes voicePanelEnter {
    from { transform: translateY(14px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }
  .voice-panel-head {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid hsl(var(--border));
  }
  .voice-panel-title { font-size: 13px; font-weight: 600; }
  .voice-panel-sub { font-size: 11px; color: hsl(var(--muted-foreground)); }

  .voice-wave {
    display: flex; align-items: center; gap: 2px; height: 18px;
  }
  .voice-wave span {
    display: inline-block;
    width: 2.5px;
    background: hsl(var(--primary));
    border-radius: 999px;
    animation: voiceBar 1.1s ease-in-out infinite;
  }
  .voice-wave.idle span { background: hsl(var(--muted-foreground) / 0.5); animation: none; height: 4px; }
  .voice-wave span:nth-child(1) { animation-delay: -0.9s; }
  .voice-wave span:nth-child(2) { animation-delay: -0.7s; }
  .voice-wave span:nth-child(3) { animation-delay: -0.5s; }
  .voice-wave span:nth-child(4) { animation-delay: -0.3s; }
  .voice-wave span:nth-child(5) { animation-delay: -0.1s; }
  .voice-wave span:nth-child(6) { animation-delay: -0.6s; }
  .voice-wave span:nth-child(7) { animation-delay: -0.4s; }
  .voice-wave span:nth-child(8) { animation-delay: -0.2s; }
  @keyframes voiceBar {
    0%, 100% { height: 4px; }
    50%      { height: 16px; }
  }

  .voice-transcript {
    max-height: 240px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 12px;
    padding: 6px 4px 4px;
  }
  .voice-turn {
    display: flex; gap: 10px;
    animation: voiceTurnEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes voiceTurnEnter {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .voice-turn .who {
    flex-shrink: 0;
    width: 22px; height: 22px; border-radius: 999px;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 600;
  }
  .voice-turn.juno .who {
    background: hsl(var(--primary));
    color: white;
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
  }
  .voice-turn.user .who {
    background: linear-gradient(135deg, hsl(152 26% 50%), hsl(168 30% 45%));
    color: white;
  }
  .voice-turn .bubble {
    font-size: 13.5px;
    line-height: 1.55;
    color: hsl(var(--foreground) / 0.92);
    padding-top: 1px;
  }
  .voice-turn.action {
    margin-left: 32px;
    padding: 5px 10px;
    background: hsl(var(--accent));
    border-radius: 8px;
    align-self: flex-start;
  }
  .voice-turn.action .who { display: none; }
  .voice-turn.action .bubble {
    color: hsl(var(--accent-foreground));
    font-size: 11.5px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .voice-turn.user .bubble { color: hsl(var(--foreground)); font-weight: 500; }
  .voice-turn .cursor {
    display: inline-block;
    width: 2px; height: 14px;
    background: hsl(var(--primary));
    vertical-align: -2px;
    margin-left: 2px;
    animation: caret 0.9s steps(2) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }

  .voice-controls {
    display: flex; align-items: center; gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid hsl(var(--border));
  }
  .voice-controls .end-btn {
    background: transparent;
    border: 1px solid hsl(var(--border));
    color: hsl(var(--muted-foreground));
    padding: 5px 12px; border-radius: 999px;
    font-size: 12px;
  }
  .voice-controls .end-btn:hover { color: hsl(var(--destructive)); border-color: hsl(var(--destructive) / 0.4); }

  /* scene launcher menu */
  .scene-menu {
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    transform: translateX(-50%);
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: 14px;
    padding: 8px;
    min-width: 360px;
    box-shadow: 0 14px 36px hsl(25 15% 18% / 0.16);
    animation: voicePanelEnter 0.24s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .scene-menu .scene-head {
    padding: 8px 12px 4px;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: hsl(var(--muted-foreground));
  }
  .scene-menu .scene-row {
    display: flex; gap: 12px; align-items: center;
    padding: 10px 12px;
    border-radius: 10px;
    background: transparent;
    border: none;
    cursor: pointer;
    text-align: left;
    width: 100%;
    color: inherit;
  }
  .scene-menu .scene-row:hover { background: hsl(var(--surface-1)); }
  .scene-menu .scene-row .ico {
    width: 32px; height: 32px; border-radius: 9px;
    background: hsl(var(--accent));
    color: hsl(var(--primary));
    display: grid; place-items: center; flex-shrink: 0;
  }
  .scene-menu .scene-row .t { font-size: 13px; font-weight: 500; }
  .scene-menu .scene-row .s { font-size: 11.5px; color: hsl(var(--muted-foreground)); margin-top: 2px; }

  /* table-like rows */
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 22px; border-bottom: 1px solid hsl(var(--border)); }
  .row:last-child { border-bottom: none; }

  /* tab strip */
  .tabs { display: inline-flex; gap: 2px; padding: 4px; background: hsl(var(--surface-2)); border-radius: 10px; }
  .tab {
    border: none; background: transparent;
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 12.5px;
    color: hsl(var(--muted-foreground));
    font-weight: 500;
  }
  .tab.active { background: hsl(var(--card)); color: hsl(var(--foreground)); box-shadow: 0 1px 2px hsl(25 15% 18% / 0.06); }

  /* meter (used in skills + health) */
  .meter {
    height: 6px;
    background: hsl(var(--surface-2));
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .meter .fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: hsl(var(--primary));
    border-radius: 999px;
  }
  .meter.thin { height: 4px; }
  .meter.thick { height: 8px; }
</style>
